
<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator Belanja</title>
</head>
<body>

    <h2>Kalkulator Belanja Toko</h2>

    <label>Pilih Barang:</label>
    <select id="barang">
        <option value="5000">Buku - Rp5.000</option>
        <option value="3000">Pensil - Rp3.000</option>
        <option value="4000">Pulpen - Rp4.000</option>
        <option value="10000">Penghapus - Rp10.000</option>
    </select>

    <br><br>

    <label>Jumlah:</label>
    <input type="number" id="jumlah">

    <br><br>

    <label>Member:</label>
    <select id="member">
        <option value="tidak">Bukan Member</option>
        <option value="ya">Member</option>
    </select>

    <br><br>

    <button onclick="hitung()">Hitung Total</button>

    <h3 id="hasil"></h3>

    <script src="script.js"></script>

</body>
</html>
